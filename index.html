<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top-Down Box Picker</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: sans-serif;
        }
        #game-wrap {
            position: relative;
            width: 800px;
            height: 600px;
        }
        canvas {
            display: block;
            background-color: #7494B0;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            cursor: crosshair;
        }
        #menuLink {
            position: absolute;
            top: 14px;
            left: 14px;
            font-size: 12px;
            color: #ecf0f1;
            background: rgba(0,0,0,0.45);
            padding: 5px 10px;
            border-radius: 4px;
            text-decoration: none;
            z-index: 5;
        }
        #menuLink:hover {
            background: rgba(0,0,0,0.7);
        }
        #interactPrompt {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 13px;
            display: none;
            pointer-events: none;
            white-space: nowrap;
        }
        #dialogueBox {
            position: absolute;
            left: 40px;
            right: 40px;
            bottom: 20px;
            background: rgba(20,20,20,0.92);
            border: 2px solid #f1c40f;
            border-radius: 8px;
            padding: 14px 18px;
            display: none;
            pointer-events: none;
        }
        #dialogueBox .name {
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 6px;
        }
        #dialogueBox .hint {
            font-size: 11px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="game-wrap">
        <a id="menuLink" href="title.html">&larr; Menu</a>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div id="interactPrompt"></div>
        <div id="dialogueBox">
            <div class="name" id="dialogueName"></div>
            <div id="dialogueText"></div>
            <div class="hint">Press E to continue</div>
        </div>
    </div>

    <script src="map.js"></script>
    <script src="game.js"></script>
</body>
</html>
